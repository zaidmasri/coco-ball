root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/northbasis-cli ./cmd/cli"
bin = "./tmp/northbasis-cli"
full_bin = "./tmp/northbasis-cli serve --db ./northbasis.db --port :8080"
include_ext = ["go", "html"]
exclude_dir = ["tmp", "vendor", ".git", ".claude"]
delay = 200
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
