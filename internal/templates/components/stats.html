{{ define "stats" }}

<header class="metrics-bar bg-white shadow-sm border-bottom py-3 px-4">
  <div class="row align-items-center text-center text-md-start">
    <div class="col-md-2 border-end">
      <small class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem"
        >Liquidity</small
      >
      <div class="d-flex align-items-center">
        <span class="fs-5 fw-bold me-2">1.5</span>
        <span class="badge bg-success bg-opacity-10 text-success rounded-pill"
          ><i class="bi bi-arrow-up-short"></i> Good</span
        >
      </div>
    </div>
    <div class="col-md-3 border-end">
      <small class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem"
        >Safety (D/E Ratio)</small
      >
      <div class="d-flex align-items-center">
        <span class="fs-5 fw-bold me-2">0.8</span>
        <span class="badge bg-warning bg-opacity-10 text-warning rounded-pill"
          >Monitor</span
        >
      </div>
    </div>
    <div class="col-md-3 border-end">
      <small class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem"
        >Profitability (Margin)</small
      >
      <div class="d-flex align-items-center">
        <span class="fs-5 fw-bold me-2">18.2%</span>
        <span class="badge bg-success bg-opacity-10 text-success rounded-pill"
          ><i class="bi bi-arrow-up-short"></i
        ></span>
      </div>
    </div>
    <div class="col-md-4">
      <small class="text-muted text-uppercase fw-bold" style="font-size: 0.7rem"
        >Efficiency (Inv. Turnover)</small
      >
      <div class="d-flex align-items-center">
        <span class="fs-5 fw-bold me-2">4.2x</span>
        <small class="text-muted ms-2">Updated just now</small>
      </div>
    </div>
  </div>
</header>

{{ end }}
