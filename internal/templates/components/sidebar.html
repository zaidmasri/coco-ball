<!-- LEFT SIDEBAR: Navigation -->
{{ define "sidebar" }}

<aside class="sidebar p-3">
  <h6
    class="text-muted text-uppercase fw-bold mb-3 mt-2 px-2"
    style="font-size: 0.75rem"
  >
    Your Plan Steps
  </h6>
  <nav class="nav flex-column gap-1">
    <!-- 0. Setup -->
    <a class="nav-link {{ if eq .Path "/setup"}} active text-primary {{else}} text-dark {{end}} py-2 px-3" href="/setup">
      <i class="bi bi-circle me-2"></i> 0. Setup
    </a>

    <!-- 1. Starting Point (Current Active Step) -->
    <a class="nav-link {{ if eq .Path "/starting-point" }} active text-primary {{else}} text-dark {{end}} py-2 px-3" href="/starting-point">
      <i class="bi bi-circle me-2"></i> 1. Starting Point
    </a>

    <!-- 2. Payroll (With sub-items) -->
    <div class="nav-item">
      <a
        class="nav-link text-dark py-2 px-3 d-flex justify-content-between align-items-center"
        href="#collapsePayroll"
        data-bs-toggle="collapse"
        role="button"
        aria-expanded="false"
      >
        <span><i class="bi bi-circle me-2 text-muted"></i> 2. Payroll</span>
        <i class="bi bi-chevron-down" style="font-size: 0.75rem"></i>
      </a>
      <div class="collapse sub-nav" id="collapsePayroll">
        <a class="nav-link text-muted py-1" href="#">2a. Year 1 Details</a>
        <a class="nav-link text-muted py-1" href="#">2b. Years 1-3 Summary</a>
      </div>
    </div>

    <!-- 3. Sales Forecast -->
    <div class="nav-item">
      <a
        class="nav-link text-dark py-2 px-3 d-flex justify-content-between align-items-center"
        href="#collapseSales"
        data-bs-toggle="collapse"
        role="button"
        aria-expanded="false"
      >
        <span
          ><i class="bi bi-circle me-2 text-muted"></i> 3. Sales Forecast</span
        >
        <i class="bi bi-chevron-down" style="font-size: 0.75rem"></i>
      </a>
      <div class="collapse sub-nav" id="collapseSales">
        <a class="nav-link text-muted py-1" href="#">3a. Year 1 Forecast</a>
        <a class="nav-link text-muted py-1" href="#">3b. Years 1-3 Forecast</a>
      </div>
    </div>

    <!-- 4. Additional Inputs -->
    <a class="nav-link text-dark py-2 px-3" href="#">
      <i class="bi bi-circle me-2 text-muted"></i> 4. Additional Inputs
    </a>

    <!-- Other sections follow same pattern... -->
    <a class="nav-link text-muted py-2 px-3" href="#"
      ><i class="bi bi-lock me-2"></i> 5. Operating Expenses</a
    >
    <a class="nav-link text-muted py-2 px-3" href="#"
      ><i class="bi bi-lock me-2"></i> 6. Cash Flow</a
    >
    <a class="nav-link text-muted py-2 px-3" href="#"
      ><i class="bi bi-lock me-2"></i> 7. Income Statement</a
    >
    <a class="nav-link text-muted py-2 px-3" href="#"
      ><i class="bi bi-lock me-2"></i> 8. Balance Sheet</a
    >
    <a class="nav-link text-muted py-2 px-3" href="#"
      ><i class="bi bi-lock me-2"></i> 9. Analytics</a
    >
  </nav>
</aside>

{{ end }}
