{{ define "base" }}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
    <style>
      /* Minor custom styling to ensure the sidebar takes full height */
      body {
        background-color: #f8f9fa; /* bg-light */
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* Prevent body scroll, handle scrolling in content areas */
      }
      .metrics-bar {
        z-index: 1030;
      }
      .app-body {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      .sidebar {
        width: 280px;
        overflow-y: auto;
        border-right: 1px solid #dee2e6;
        background-color: #ffffff;
      }
      .main-content {
        flex: 1;
        overflow-y: auto;
      }
      /* Styling for active/completed nav items */
      .nav-link.active {
        background-color: #e9ecef;
        font-weight: 600;
        border-radius: 0.375rem;
      }
      .nav-link.completed {
        color: #198754; /* Success green */
      }
      .sub-nav {
        font-size: 0.875rem;
        margin-left: 1.5rem;
        border-left: 1px solid #dee2e6;
        padding-left: 0.5rem;
      }
    </style>
  </head>

  <body>
    <!-- Inject Top Sticky Metrics -->
    {{ template "stats" . }}

    <div class="app-body">
      <!-- Inject Navigation Sidebar -->
      {{ template "sidebar" . }}

      <!-- MAIN CONTENT AREA -->
      <main class="main-content bg-light p-4 p-lg-5">
        <!-- THIS IS THE MAGIC YIELD POINT -->
        <!-- Child templates will inject their HTML right here -->
        {{ block "content" . }}{{ end }}
      </main>
    </div>

    <!-- Shared Scripts -->
    <script src="/static/js/bootstrap.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
{{ end }}
