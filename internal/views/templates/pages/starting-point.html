{{ template "base" . }}

{{ define "content" }}
<div class="container-fluid container mx-auto">
  <div class="card shadow-sm border-0 rounded-3">
    <!-- Step Header -->
    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4 px-md-5">
      <span class="badge bg-primary bg-opacity-10 text-primary mb-2">Step 2 of 9</span>
      <h2 class="card-title fw-bold mb-3">Starting Point</h2>
      <p class="lead text-secondary" style="font-size: 1.1rem">
        Let's establish your baseline, one section at a time. Work through
        each section below — you can leave and come back whenever you like.
      </p>
      <hr class="mt-4 mb-0 text-muted" />
    </div>

    <!-- Section Status Table -->
    <div class="card-body p-4 p-md-5">
      {{ template "sections-table" . }}
    </div>

    <!-- Footer Navigation (Back / Next) -->
    <div class="card-footer bg-light border-top p-4 px-md-5 d-flex justify-content-between align-items-center rounded-bottom-3">
      <a href="/plan/{{ .Plan.ID }}/setup" class="btn btn-outline-secondary px-4 py-2 text-uppercase fw-bold" style="font-size: 0.85rem">
        <i class="bi bi-arrow-left me-1"></i> Back
      </a>
      <a href="/plan/{{ .Plan.ID }}/payroll" class="btn btn-primary px-5 py-2 text-uppercase fw-bold shadow-sm" style="font-size: 0.85rem">
        Continue <i class="bi bi-arrow-right ms-1"></i>
      </a>
    </div>
  </div>
</div>
{{ end }}
