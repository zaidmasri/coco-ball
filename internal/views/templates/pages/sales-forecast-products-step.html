{{ template "base" . }}

{{ define "question-fields" }}
{{ if eq .Step "name" }}
<label for="name" class="form-label fw-bold fs-5">What's this product or service called?</label>
<input type="text" class="form-control form-control-lg" id="name" name="name"
       value="{{ .Product.Name }}" autofocus required />

{{ else if eq .Step "month1-units" }}
<label for="month1_units" class="form-label fw-bold fs-5">How many units do you expect to sell in Month 1?</label>
<input type="number" min="0" class="form-control form-control-lg" id="month1_units" name="month1_units"
       value="{{ if ne .Product.Month1Units 0 }}{{ .Product.Month1Units }}{{ end }}" autofocus required />

{{ else if eq .Step "price" }}
<label for="price" class="form-label fw-bold fs-5">What's the sales price per unit?</label>
<div class="input-group input-group-lg">
  <span class="input-group-text">$</span>
  <input type="number" step="0.01" min="0" class="form-control" id="price" name="price"
         value="{{ if ne .Product.PricePerUnit 0 }}{{ .Product.PricePerUnit }}{{ end }}" autofocus required />
</div>

{{ else if eq .Step "cost" }}
<label for="cost" class="form-label fw-bold fs-5">What's the direct cost (COGS) per unit?</label>
<div class="input-group input-group-lg">
  <span class="input-group-text">$</span>
  <input type="number" step="0.01" min="0" class="form-control" id="cost" name="cost"
         value="{{ if ne .Product.CostPerUnit 0 }}{{ .Product.CostPerUnit }}{{ end }}" autofocus required />
</div>
{{ end }}
{{ end }}

{{ define "content" }}{{ template "question-step" . }}{{ end }}
