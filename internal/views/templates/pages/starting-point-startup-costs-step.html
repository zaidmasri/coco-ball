{{ template "base" . }}

{{ define "question-fields" }}
{{ if eq .Step "name" }}
<label for="name" class="form-label fw-bold fs-5">What is this startup cost?</label>
<input type="text" class="form-control form-control-lg" id="name" name="name"
       value="{{ .Cost.Name }}" autofocus required />
<div class="d-flex flex-wrap gap-2 mt-2 mb-3">
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Pre-Opening Salaries and Wages</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Prepaid Insurance Premiums</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Inventory</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Legal and Accounting</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Rent Deposits</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Utility Deposits</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Supplies</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Advertising and Promotions</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Licenses</button>
  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill suggestion-pill">Other Initial Startup Costs</button>
</div>

{{ else if eq .Step "amount" }}
<label for="amount" class="form-label fw-bold fs-5">How much will it cost?</label>
<div class="input-group input-group-lg">
  <span class="input-group-text">$</span>
  <input type="number" step="0.01" min="0" class="form-control" id="amount" name="amount"
         value="{{ if ne .Cost.Amount 0 }}{{ .Cost.Amount }}{{ end }}" autofocus required />
</div>
{{ end }}
{{ end }}

{{ define "content" }}{{ template "question-step" . }}{{ end }}
