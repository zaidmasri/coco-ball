<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .ErrorTitle }} | Business Planning Tool</title>
    <link rel="stylesheet" href="/static/icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="container text-center py-5 mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <i
            class="bi bi-search text-secondary opacity-50"
            style="font-size: 5rem"
          ></i>
          <h1 class="display-4 fw-bold mt-3">{{ .ErrorStatusCode }}</h1>
          <h2 class="mb-4">{{ .ErrorDescription }}</h2>

          <!-- DYNAMIC MESSAGE INJECTION -->
          <p class="lead text-muted mb-5">
            {{ if .Message }} {{ .Message }} {{ else }} Oops! We couldn't find
            the page you were looking for. It might have been removed, had its
            name changed, or is temporarily unavailable. {{ end }}
          </p>

          <a
            href="/"
            class="btn btn-primary px-5 py-2 text-uppercase fw-bold shadow-sm"
          >
            <i class="bi bi-house-door me-2"></i> Go to Homepage
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
