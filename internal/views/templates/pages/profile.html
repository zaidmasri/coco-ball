{{define "profile.html"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/icons/bootstrap-icons.css" />
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <!-- Header with User Menu -->
    <header class="bg-white shadow-sm border-bottom py-3 px-4">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <a href="/" class="btn btn-light text-primary shadow-sm border border-primary-subtle rounded-circle d-flex align-items-center justify-content-center p-2" title="Home" style="width: 40px; height: 40px">
          <i class="bi bi-house-door-fill fs-5"></i>
        </a>

        {{if .User}}
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            <span class="d-none d-md-inline text-truncate" style="max-width: 150px;">{{ .User.Email }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li>
              <a class="dropdown-item" href="/profile">
                <i class="bi bi-person me-2"></i>Profile
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <form method="POST" action="/logout">
                <button type="submit" class="dropdown-item text-danger">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </form>
            </li>
          </ul>
        </div>
        {{end}}
      </div>
    </header>

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h2 class="fw-bold mb-4">
            <i class="bi bi-person-circle me-2"></i>Profile
          </h2>

          <div class="card shadow-sm border-0 rounded-3 mb-4">
            <div class="card-body p-5">
              <h4 class="card-title fw-bold mb-4">Profile Information</h4>

              <div class="mb-4">
                <label class="form-label text-muted text-uppercase fw-bold" style="font-size: 0.85rem;">
                  Email Address
                </label>
                <div class="fs-5">{{ .User.Email }}</div>
              </div>

              <hr class="my-4" />

              <p class="text-muted small mb-0">
                <i class="bi bi-info-circle me-2"></i>
                Additional profile settings coming soon.
              </p>
            </div>
          </div>

          <div class="card shadow-sm border-0 rounded-3 border-danger">
            <div class="card-body p-5">
              <h4 class="card-title fw-bold text-danger mb-4">
                <i class="bi bi-exclamation-triangle me-2"></i>Danger Zone
              </h4>

              <p class="text-muted mb-4">
                These actions are irreversible. Please proceed with caution.
              </p>

              <button type="button" class="btn btn-outline-danger" disabled title="Coming soon">
                <i class="bi bi-trash me-2"></i>Delete Account
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
{{end}}
