<!-- QUESTION STEP: the shared "one question at a time" wizard shell used
     by every Starting Point section's step pages. Expects "." to be a page
     struct embedding views.QuestionStepPage (SectionIcon/SectionTitle/
     Step/StepNumber/TotalSteps/FormAction/BackURL/CancelURL/ButtonLabel/
     ErrorMessage/Plan), plus a per-page "question-fields" template
     defining the actual input(s) for the current .Step - each step
     template file (e.g. starting-point-fixed-assets-step.html) defines
     its own "question-fields" block right before calling this. -->
{{ define "question-step" }}
<div class="container-fluid container mx-auto" style="max-width: 640px">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4 px-md-5">
      <span class="badge bg-primary bg-opacity-10 text-primary mb-2">
        <i class="bi {{ .SectionIcon }} me-1"></i> {{ .SectionTitle }} &middot; Question {{ .StepNumber }} of {{ .TotalSteps }}
      </span>
    </div>

    <div class="card-body p-4 p-md-5">
      {{ if .ErrorMessage }}
      <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div>{{ .ErrorMessage }}</div>
      </div>
      {{ end }}

      <form action="{{ .FormAction }}" method="POST">
        {{ template "question-fields" . }}

        <div class="d-flex justify-content-between align-items-center mt-5">
          {{ if .BackURL }}
          <a href="{{ .BackURL }}" class="btn btn-outline-secondary px-4 py-2 text-uppercase fw-bold" style="font-size: 0.85rem">
            <i class="bi bi-arrow-left me-1"></i> Back
          </a>
          {{ else }}
          <a href="{{ .CancelURL }}" class="btn btn-outline-secondary px-4 py-2 text-uppercase fw-bold" style="font-size: 0.85rem">
            <i class="bi bi-x-lg me-1"></i> Cancel
          </a>
          {{ end }}
          <button type="submit" class="btn btn-primary px-5 py-2 text-uppercase fw-bold shadow-sm" style="font-size: 0.85rem">
            {{ .ButtonLabel }} <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{{ end }}
