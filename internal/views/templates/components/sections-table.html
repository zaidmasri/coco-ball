<!-- SECTIONS TABLE: a wizard hub summary's list of sections, each with a
     completion badge and a Get Started (-> intro page) or Edit (-> straight
     into the section) link. Used by all four hubs (Starting Point, Payroll,
     Sales Forecast, Cash Flow). Expects "." to be a []views.HubSectionStatus
     - EditURL/GetStartedURL are pre-built per section, so this component has
     no hub-specific knowledge. -->
{{ define "sections-table" }}
<div class="card border shadow-sm">
  <ul class="list-group list-group-flush">
    {{ range . }}
    <li class="list-group-item d-flex justify-content-between align-items-center p-3">
      <div class="d-flex align-items-center">
        <div
          class="rounded-circle border d-flex justify-content-center align-items-center me-3 {{ if .Complete }}bg-success bg-opacity-10 text-success{{ else }}bg-light text-muted{{ end }}"
          style="width: 40px; height: 40px"
        >
          {{ if .Complete }}
          <i class="bi bi-check-lg"></i>
          {{ else }}
          <i class="bi bi-circle"></i>
          {{ end }}
        </div>
        <div>
          <h6 class="mb-0 fw-bold">{{ .Title }}</h6>
          <small class="text-muted">
            {{ .Description }}
            {{ if gt .ItemCount 0 }}&middot; {{ .ItemCount }} added{{ end }}
          </small>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        {{ if .Complete }}
        <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3 py-2">Complete</span>
        <a href="{{ .EditURL }}" class="btn btn-sm btn-outline-primary">Edit</a>
        {{ else }}
        <span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-3 py-2">Not Started</span>
        <a href="{{ .GetStartedURL }}" class="btn btn-sm btn-primary">Get Started</a>
        {{ end }}
      </div>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
