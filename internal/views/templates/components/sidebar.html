<!-- LEFT SIDEBAR: Navigation -->
{{ define "sidebar" }}
    <aside class="sidebar p-3">
        <h6 class="text-muted text-uppercase fw-bold mb-3 mt-2 px-2"
            style="font-size: 0.75rem">Your Plan Steps</h6>
        <nav class="nav flex-column gap-1">
            <!-- 1. Setup -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/setup" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/setup">
    <i class="bi bi-1-circle-fill me-2"></i> Setup
    </a>
    <!-- 2. Starting Point -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/starting-point" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/starting-point">
    <i class="bi {{ if .StartingPointComplete }}bi-2-circle-fill{{ else }}bi-2-circle{{ end }} me-2"></i> Starting Point
    </a>
    <!-- 3. Payroll (With sub-items) -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/payroll" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/payroll">
    <i class="bi bi-3-circle me-2"></i> Payroll
    </a>
    <!-- 4. Sales Forecast -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/sales-forecast" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/sales-forecast">
    <i class="bi bi-4-circle me-2"></i> Sales Forecast
    </a>
    <!-- 5. Operating Expenses -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/operating-expenses" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/operating-expenses">
    <i class="bi bi-5-circle me-2"></i> Operating Expenses
    </a>
    <!-- 6. Cash Flow -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/cash-flow" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/cash-flow">
    <i class="bi bi-6-circle me-2"></i> Cash Flow
    </a>
    <!-- 7. Income Statement -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/income-statement" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/income-statement">
    <i class="bi bi-7-circle-fill me-2"></i> Income Statement
    </a>
    <!-- 8. Balance Sheet -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/balance-sheet" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/balance-sheet">
    <i class="bi bi-8-circle-fill me-2"></i> Balance Sheet
    </a>
    <!-- 9. Analytics -->
<a class="nav-link {{ if eq .Path (printf "/plan/%s/analytics" .Plan.ID) }} active text-primary {{else}} text-dark {{end}} py-2 px-3"
   href="/plan/{{ .Plan.ID }}/analytics">
    <i class="bi bi-9-circle-fill me-2"></i> Analytics
    </a>
    </nav>
    </aside>
{{ end }}
