<!-- ADD ANOTHER: the shared "add another?" interstitial shown after
     finishing one item of a repeatable wizard section, used across all
     four hubs. Expects "." to be a views.AddAnotherPage. -->
{{ define "add-another" }}
<div class="container-fluid container mx-auto" style="max-width: 640px">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-4 p-md-5 text-center">
      <div class="rounded-circle bg-success bg-opacity-10 text-success d-inline-flex justify-content-center align-items-center mb-3" style="width: 64px; height: 64px">
        <i class="bi bi-check-lg fs-2"></i>
      </div>
      <h3 class="fw-bold mb-2">Added "{{ .ItemName }}"</h3>
      {{ template "answered-summary" .Answers }}
      <p class="fw-bold mb-3">Add another {{ .ItemNounSingular }}?</p>
      <div class="d-flex justify-content-center gap-3">
        <form method="POST" action="{{ .DoneAction }}">
          <button type="submit" class="btn btn-outline-secondary px-4 py-2 fw-bold">No, I'm done</button>
        </form>
        <form method="POST" action="{{ .AddAnotherAction }}">
          <button type="submit" class="btn btn-primary px-4 py-2 fw-bold">
            <i class="bi bi-plus-lg me-1"></i> Add another
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{{ end }}
