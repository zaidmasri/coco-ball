services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify assigns a domain and proxies to this port from its dashboard;
    # no host port publish is needed.
    expose:
      - "8080"
    volumes:
      - northbasis-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  northbasis-data:
